name: Deploy Clearance System to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Web Hosting via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Production .env from GitHub Secrets
        run: |
          cat << 'EOF' > .env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER || secrets.FTP_USERNAME }}
          DB_PASS=${{ secrets.DB_PASS || secrets.DB_PASSWORD || secrets.FTP_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF
        shell: bash

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/*.code-workspace
            **/README.md
            **/.env.example
            **/*.sql
            **/*.sql.gz
            **/*.zip
            **/.DS_Store
            **/Thumbs.db
            **/Desktop.ini
