name: Deploy Clearance System to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Web Hosting via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Production config.production.php from Secrets
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          DB_H: ${{ secrets.DB_HOST }}
          DB_N: ${{ secrets.DB_NAME }}
        run: |
          cat << EOF > config.production.php
          <?php
          define('DB_HOST', '${DB_H:-sql200.byetcluster.com}');
          define('DB_USER', '${FTP_USER:-if0_43197826}');
          define('DB_PASS', '${FTP_PASS}');
          define('DB_NAME', '${DB_N:-if0_43197826_clearance}');
          EOF
        shell: bash

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/*.code-workspace
            **/README.md
            **/.env.example
            **/*.sql
            **/*.sql.gz
            **/*.zip
            **/.DS_Store
            **/Thumbs.db
            **/Desktop.ini
